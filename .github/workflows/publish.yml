name: Publish workspace crates

on:
  workflow_dispatch: {}
  push:
    paths:
      - "**/Cargo.toml"
      - ".github/workflows/publish.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - ".github/workflows/publish.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@65012b490220f477f20ab979e35ae732e6de4e68
      - name: Verify workspace packaging
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: cargo publish --dry-run --workspace --no-default-features --features rustls
      - name: Publish workspace
        if: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish --verbose --workspace --no-default-features --features rustls
